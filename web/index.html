<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A native macOS terminal workspace that brings projects, files, Git and local AI tools together."
    />
    <meta property="og:title" content="Qjiao — Beginner-Friendly Terminal Workspace" />
    <meta
      property="og:description"
      content="Bring TUI and GUI together in a calm, native macOS workspace."
    />
    <meta property="og:image" content="./og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./qjiao-icon.png" />
    <link rel="apple-touch-icon" href="./qjiao-icon.png" />
    <title>Qjiao — Beginner-Friendly Terminal Workspace</title>
    <script>
      (function () {
        try {
          var path = window.location.pathname;
          var isExplicitSubpath = path.indexOf("/zh-Hans") !== -1 || path.indexOf("/ja") !== -1;
          if (isExplicitSubpath) {
            var currentLang = path.indexOf("/zh-Hans") !== -1 ? "zh-Hans" : "ja";
            localStorage.setItem("qjiao_lang", currentLang);
            return;
          }
          var saved = localStorage.getItem("qjiao_lang");
          var targetLang = saved;
          if (!targetLang) {
            var langs = navigator.languages || (navigator.language ? [navigator.language] : []);
            for (var i = 0; i < langs.length; i++) {
              var l = (langs[i] || "").toLowerCase();
              if (l.indexOf("zh") === 0) { targetLang = "zh-Hans"; break; }
              if (l.indexOf("ja") === 0) { targetLang = "ja"; break; }
              if (l.indexOf("en") === 0) { targetLang = "en"; break; }
            }
          }
          if (targetLang && targetLang !== "en" && (targetLang === "zh-Hans" || targetLang === "ja")) {
            window.location.replace("./" + targetLang + "/" + window.location.search + window.location.hash);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
